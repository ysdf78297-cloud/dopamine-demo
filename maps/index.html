<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Maps V2</title>
<meta name="theme-color" content="#f7f9fc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Maps V2">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="stylesheet" href="./vendor/leaflet.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="maps">
  <div id="map"></div>
  <div id="globe" class="hidden"><canvas id="globeCanvas"></canvas><div class="globeHint">Drag to spin · tap to open the map</div></div>

  <div id="topbar">
    <button id="searchBtn" class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <span id="searchText">Search places</span>
    </button>
  </div>

  <div id="coordChip" class="hidden">
    <span id="coordText">--</span>
    <button id="coordGo">Directions</button>
  </div>

  <div id="mapControls">
    <button id="zoomIn" aria-label="Zoom in">+</button>
    <button id="zoomOut" aria-label="Zoom out">&minus;</button>
    <button id="world" aria-label="World view">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
    </button>
    <button id="locate" aria-label="My location">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><circle cx="12" cy="12" r="2.5"/></svg>
    </button>
    <button id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 8.86a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.26.63.87 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>

  <div id="navBanner" class="hidden">
    <div class="navInfo"><b id="navEta">-- min</b><span id="navMiles">-- mi</span></div>
    <button id="navCancel" class="navCancel">Cancel</button>
  </div>

  <div id="alert" class="hidden"><span id="alertText">Alert</span></div>

  <div id="nextBanner" class="hidden"><b id="nextText">Continue straight</b></div>

  <div id="speedSign" class="hidden"><span>SPEED LIMIT</span><b id="speedLimit">30</b></div>
  <div id="warningSign" class="hidden"><b>!</b><span id="warningText">No parking</span></div>
  <div id="speedo" class="hidden"><b id="speedValue">0</b><span>mph</span></div>

  <div id="sheet" class="sheet hidden">
    <div class="grab" id="sheetGrab"></div>
    <div id="sheetBody">
      <div id="routeState" class="hidden">
        <div class="destRow">
          <div class="destIcon">
            <svg viewBox="0 0 24 24"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
          </div>
          <div class="destText"><b id="destName">Destination</b><span id="destSub">Route</span></div>
          <button id="go" class="go">Go</button>
        </div>
        <div id="alts" class="alts"></div>
      </div>
    </div>
  </div>

  <div id="perm" class="overlay hidden">
    <div class="permCard">
      <div class="permIcon">
        <svg viewBox="0 0 24 24"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      </div>
      <h3>Location access needed</h3>
      <p>Maps V2 can't track your location. Please allow location access in the Settings app.</p>
      <button id="openSettings" class="permBtn">Open Settings</button>
      <button id="permLater" class="permGhost">Not now</button>
    </div>
  </div>

  <div id="searchSheet" class="overlay hidden">
    <div class="searchPanel">
      <div class="grab"></div>
      <div class="inputRow">
        <input id="searchInput" type="text" placeholder="Search places or coordinates" autocomplete="off">
        <button id="closeSearch">Cancel</button>
      </div>
      <div class="modes" id="modes">
        <button class="mode active" data-mode="driving">Car</button>
        <button class="mode" data-mode="bike">Bike</button>
        <button class="mode" data-mode="foot">Walk</button>
      </div>
      <div id="recent"></div>
      <div id="results"></div>
    </div>
  </div>

  <div id="placeSheet" class="overlay hidden">
    <div class="searchPanel placePanel">
      <div class="grab"></div>
      <div id="placeImage" class="placeImage"></div>
      <h3 id="placeName">Place</h3>
      <div id="placeMeta" class="placeMeta"></div>
      <p id="placeDesc" class="placeDesc"></p>
      <div id="placeReviews" class="placeReviews"></div>
      <button id="placeGo" class="placeGo">Go</button>
      <button id="placeClose" class="placeClose">Close</button>
    </div>
  </div>

  <div id="settingsSheet" class="overlay hidden">
    <div class="searchPanel">
      <div class="grab"></div>
      <div class="sheetHead"><h3>Settings</h3><button id="closeSettings">Done</button></div>
      <div class="settingLabel">Appearance</div>
      <button class="opt" data-style="colored"><span>Default</span><span class="check">&#10003;</span></button>
      <button class="opt" data-style="mono"><span>All map</span><span class="check">&#10003;</span></button>
      <button class="opt" data-style="satellite"><span>Satellite</span><span class="check">&#10003;</span></button>
      <div class="settingLabel">Navigation</div>
      <div class="toggleRow"><span>Show coordinates</span><button id="toggleCoords" class="switch"></button></div>
      <div class="toggleRow"><span>Show speed</span><button id="toggleSpeed" class="switch on"></button></div>
    </div>
  </div>
</div>

<script src="./vendor/leaflet.js"></script>
<script src="./vendor/three.min.js"></script>
<script src="./vendor/earth-base64.js"></script>
<script src="./app.js"></script>
</body>
</html>
