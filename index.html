<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dopamine</title>
<meta name="theme-color" content="#7d6ce6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dopamine">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="app">
  <header class="hero">
    <h1>Dopamine</h1>
    <p class="sub">iOS 26.0 &ndash; 27.0</p>
    <p class="sub sub2">iPhone 15 Pro &middot; A17 Pro &middot; arm64e</p>
    <p class="status"><span class="dot"></span>Status: Supported</p>
  </header>

  <nav class="menu" id="menu">
    <button class="row" data-row="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 8.86a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.26.63.87 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>Settings</span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <button class="row" data-row="respring">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      <span>Restart SpringBoard</span>
    </button>
    <button class="row" data-row="userspace">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
      <span>Reboot Userspace</span>
    </button>
    <button class="row" data-row="credits">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <span>Credits</span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </nav>

  <div class="spacer"></div>

  <button id="jailbreak" class="cta">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
    <span>Jailbreak</span>
  </button>
</div>

<div id="console" class="overlay hidden" aria-hidden="true">
  <div class="console-sheet">
    <div class="console-head">
      <span class="spinner"></span>
      <span id="consoleTitle">Jailbreaking</span>
    </div>
    <pre id="log"></pre>
    <div class="progress"><div id="fill"></div></div>
  </div>
</div>

<div id="boot" class="overlay hidden" aria-hidden="true">
  <div class="boot-log"><div id="bootLog"></div></div>
  <div class="boot-center">
    <img class="apple" id="bootApple" src="./icons/apple.svg" alt="">
  </div>
</div>

<div id="done" class="overlay hidden" aria-hidden="true">
  <div class="done-card">
    <div class="done-badge">&#10003;</div>
    <h2>This was a fake demo</h2>
    <p>Thank you for doing this.</p>
    <p class="small">Nothing on this iPhone was changed.</p>
    <button id="closeDone">Done</button>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
