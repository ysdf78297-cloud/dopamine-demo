name: Dopamine
options:
  bundleIdPrefix: com.demo
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  Dopamine:
    type: application
    platform: iOS
    sources:
      - path: Dopamine
      - path: www
        type: folder
    settings:
      base:
        PRODUCT_NAME: Dopamine
        PRODUCT_BUNDLE_IDENTIFIER: com.demo.dopamine
        INFOPLIST_FILE: Dopamine/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Dopamine:
    build:
      targets:
        Dopamine: all
    run:
      config: Release
