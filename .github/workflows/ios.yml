name: Build IPAs

on:
  push:
    branches: [ main ]
    paths:
      - "ios/**"
      - "sileo/**"
      - "zebra/**"
      - "maps/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "manifest.webmanifest"
      - "icons/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Stage web assets into the app bundles
        run: |
          mkdir -p ios/Dopamine/www/icons ios/Sileo/www ios/Zebra/www ios/MapsV2/www
          cp index.html styles.css app.js manifest.webmanifest ios/Dopamine/www/
          cp icons/*.png icons/*.svg ios/Dopamine/www/icons/
          cp sileo/index.html sileo/styles.css sileo/app.js sileo/icon-180.png sileo/icon-192.png ios/Sileo/www/
          cp zebra/index.html zebra/styles.css zebra/app.js zebra/icon-180.png zebra/icon-192.png ios/Zebra/www/
          cp maps/index.html maps/styles.css maps/app.js maps/icon-180.png maps/icon-192.png ios/MapsV2/www/
          cp -R maps/vendor ios/MapsV2/www/

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          for APP in Dopamine Sileo Zebra MapsV2; do
            xcodebuild \
              -project Dopamine.xcodeproj \
              -scheme "$APP" \
              -sdk iphoneos \
              -configuration Release \
              -derivedDataPath "build-$APP" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS="" \
              build
          done

      - name: Package unsigned IPAs
        working-directory: ios
        run: |
          mkdir -p out
          for APP in Dopamine Sileo Zebra MapsV2; do
            rm -rf out/Payload
            mkdir -p out/Payload
            cp -R "build-$APP/Build/Products/Release-iphoneos/$APP.app" out/Payload/
            (cd out && zip -qry "$APP.ipa" Payload)
            ls -lh "out/$APP.ipa"
          done
          rm -rf out/Payload

      - name: Upload IPAs
        uses: actions/upload-artifact@v4
        with:
          name: ipas
          path: ios/out/*.ipa
          if-no-files-found: error
